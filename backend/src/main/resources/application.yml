spring:
  application:
    name: museum-api
  datasource:
    url: ${MUSEUM_DB_URL:jdbc:mysql://localhost:3306/museum?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MUSEUM_DB_USERNAME:museum}
    password: ${MUSEUM_DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
server:
  port: ${MUSEUM_SERVER_PORT:8080}
