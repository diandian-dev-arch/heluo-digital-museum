spring:
  application:
    name: museum-api
  datasource:
    url: ${MUSEUM_DB_URL:jdbc:mysql://localhost:3306/museum?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MUSEUM_DB_USERNAME:museum}
    password: ${MUSEUM_DB_PASSWORD:change-me}
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
  mail:
    host: ${MUSEUM_SMTP_HOST:}
    port: ${MUSEUM_SMTP_PORT:1025}
    username: ${MUSEUM_SMTP_USERNAME:}
    password: ${MUSEUM_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${MUSEUM_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MUSEUM_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
logging:
  pattern:
    level: '%5p [requestId:%X{requestId}]'
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
server:
  port: ${MUSEUM_SERVER_PORT:8080}
museum:
  security:
    jwt-secret: ${MUSEUM_JWT_SECRET:}
    access-token-ttl: ${MUSEUM_ACCESS_TOKEN_TTL:PT8H}
  bootstrap:
    enabled: ${MUSEUM_BOOTSTRAP_ENABLED:false}
    admin-username: ${MUSEUM_BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${MUSEUM_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-email: ${MUSEUM_BOOTSTRAP_ADMIN_EMAIL:}
  mail:
    from: ${MUSEUM_MAIL_FROM:no-reply@heluo.local}
    public-base-url: ${MUSEUM_PUBLIC_BASE_URL:http://localhost:8088}
  orders:
    expiry-initial-delay-ms: ${MUSEUM_ORDER_EXPIRY_INITIAL_DELAY_MS:60000}
    expiry-scan-ms: ${MUSEUM_ORDER_EXPIRY_SCAN_MS:60000}
