services:
  mailpit:
    image: axllent/mailpit:v1.27.7
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "${MUSEUM_MAIL_WEB_PORT:-8025}:8025"
    networks: [museum-network]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-museum}
      MYSQL_USER: ${MYSQL_USER:-museum_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [museum-network]

  backend:
    build:
      context: ../backend
    environment:
      MUSEUM_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-museum}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      MUSEUM_DB_USERNAME: ${MYSQL_USER:-museum_app}
      MUSEUM_DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/.env}
      MUSEUM_JWT_SECRET: ${MUSEUM_JWT_SECRET:?set MUSEUM_JWT_SECRET in deploy/.env}
      MUSEUM_BOOTSTRAP_ENABLED: ${MUSEUM_BOOTSTRAP_ENABLED:-false}
      MUSEUM_BOOTSTRAP_ADMIN_USERNAME: ${MUSEUM_BOOTSTRAP_ADMIN_USERNAME:-}
      MUSEUM_BOOTSTRAP_ADMIN_PASSWORD: ${MUSEUM_BOOTSTRAP_ADMIN_PASSWORD:-}
      MUSEUM_BOOTSTRAP_ADMIN_EMAIL: ${MUSEUM_BOOTSTRAP_ADMIN_EMAIL:-}
      MUSEUM_SMTP_HOST: ${MUSEUM_SMTP_HOST:-mailpit}
      MUSEUM_SMTP_PORT: ${MUSEUM_SMTP_PORT:-1025}
      MUSEUM_SMTP_USERNAME: ${MUSEUM_SMTP_USERNAME:-}
      MUSEUM_SMTP_PASSWORD: ${MUSEUM_SMTP_PASSWORD:-}
      MUSEUM_SMTP_AUTH: ${MUSEUM_SMTP_AUTH:-false}
      MUSEUM_SMTP_STARTTLS: ${MUSEUM_SMTP_STARTTLS:-false}
      MUSEUM_MAIL_FROM: ${MUSEUM_MAIL_FROM:-no-reply@heluo.local}
      MUSEUM_PUBLIC_BASE_URL: ${MUSEUM_PUBLIC_BASE_URL:-http://localhost:${MUSEUM_WEB_PORT:-8088}}
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks: [museum-network]

  frontend:
    build:
      context: ../frontend
    depends_on: [backend]
    ports:
      - "${MUSEUM_WEB_PORT:-8088}:80"
    networks: [museum-network]

networks:
  museum-network:

volumes:
  mysql-data:
