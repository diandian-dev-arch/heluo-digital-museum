<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7faf8" />
    <meta name="description" content="河洛数字博物馆：在线探索馆藏故事、3D 数字展项并预约线下参观。" />
    <title>河洛数字博物馆</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        try {
          const theme = window.localStorage.getItem('heluo.theme') === 'dark' ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#12110f' : '#f7faf8')
        } catch (_) {}
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
